syntax = "proto3";

package difference_scattering.v1;

service DifferenceScatteringService {
  rpc ComputeDifferenceScattering(DifferenceScatteringRequest)
      returns (DifferenceScatteringResponse);
}

message StructureInput {
  string filename = 1;
  bytes xyz_data = 2;
}

message DsdtTable {
  string filename = 1;
  bytes table_data = 2;
}

message QRange {
  double qmin = 1;
  double qmax = 2;
  double qstep = 3;
}

message DifferenceScatteringRequest {
  StructureInput ground_state = 1;
  StructureInput excited_state = 2;
  DsdtTable dsdt_table = 3;
  double excited_state_fraction = 4;
  double optical_photon_energy_ev = 5;
  double excited_state_energy_ev = 6;
  double concentration_solute_molar = 7;
  string solvent_name = 8;
  QRange q_range = 9;
  optional double deposited_energy_joule = 10;
  optional double delta_temperature_k = 11;
}

message DifferenceScatteringResponse {
  repeated double q = 1;
  repeated double delta_s_total = 2;
  repeated double delta_s_solute = 3;
  repeated double delta_s_solvent = 4;
  double deposited_energy_joule = 5;
  double delta_temperature_k = 6;
  double solvent_to_solute_ratio = 7;
}
