version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-es
    opt: target=ts
    out: ./src/lib/server/grpc/gen
    include_imports: true
  - remote: buf.build/protocolbuffers/python
    out: ./backend/src/simex_debye_grpc/gen
  - remote: buf.build/protocolbuffers/pyi
    out: ./backend/src/simex_debye_grpc/gen
  - remote: buf.build/connectrpc/python
    out: ./backend/src/simex_debye_grpc/gen
inputs:
  - directory: ./proto/
